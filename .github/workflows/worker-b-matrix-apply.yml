name: Worker B Matrix Repair Apply

on:
  push:
    branches:
      - parallel/v0.4.0-browser-ux

permissions:
  contents: write

jobs:
  repair-matrix-test:
    if: "${{ startsWith(github.event.head_commit.message, 'ci: apply Worker B matrix dependency repair') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Align matrix harness with runtime dependencies and async activation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/browser/browser-runtime-matrix.e2e.test.js')
          s = p.read_text(encoding='utf-8')
          trigger_anchor = "  'shared/settings.js',\n  'shared/sentence-pipeline.js',\n"
          trigger_replacement = "  'shared/settings.js',\n  'shared/trigger-controller.js',\n  'shared/sentence-pipeline.js',\n"
          if s.count(trigger_anchor) != 1:
              raise SystemExit(f'expected exactly one trigger dependency anchor, found {s.count(trigger_anchor)}')
          s = s.replace(trigger_anchor, trigger_replacement)
          pairs = [
            ("  const firstStatus = await sendContentCommand(page, 'HALO_APPLY_MARKING');\n  assert.equal(firstStatus && firstStatus.active, true, `${fixture.id}: APPLY did not activate runtime`);\n", "  await sendContentCommand(page, 'HALO_APPLY_MARKING');\n"),
            ("  const secondStatus = await sendContentCommand(page, 'HALO_APPLY_MARKING');\n  assert.equal(secondStatus && secondStatus.active, true, `${fixture.id}: second APPLY did not activate runtime`);\n", "  await sendContentCommand(page, 'HALO_APPLY_MARKING');\n")
          ]
          for before, after in pairs:
              if s.count(before) != 1:
                  raise SystemExit(f'expected exactly one timing assertion anchor, found {s.count(before)}')
              s = s.replace(before, after)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Real Chromium matrix GREEN candidate
        run: node --test tests/browser/browser-runtime-matrix.e2e.test.js
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified test repair
        run: |
          git config user.name "EveMissLab Worker B"
          git config user.email "worker-b@users.noreply.github.com"
          git add tests/browser/browser-runtime-matrix.e2e.test.js
          git diff --cached --quiet && { echo 'No test change to commit'; exit 1; }
          git commit -m "test: align matrix harness with runtime dependencies"
          git push origin HEAD:parallel/v0.4.0-browser-ux
