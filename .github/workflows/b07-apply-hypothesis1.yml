name: B07 Apply Hypothesis 1

on:
  push:
    branches:
      - integration/v0.4.0-final-convergence
    paths:
      - scripts/b07-hypothesis1.patch

permissions:
  contents: write

concurrency:
  group: b07-hypothesis1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify bootstrap is still canonical
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/v0.4.0-final-convergence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/integration/v0.4.0-final-convergence)" = "$GITHUB_SHA"
      - name: Apply B07 hypothesis 1
        shell: bash
        run: |
          set -euo pipefail
          git apply --check scripts/b07-hypothesis1.patch
          git apply scripts/b07-hypothesis1.patch
          git diff --check
      - name: Focused B07 regression
        run: >-
          node --test
          tests/browser-lexical-shards.test.js
          tests/worker-e-runtime-performance.test.js
          tests/browser-shard-loader.test.js
          tests/worker-e-descriptor-bytes.test.js
          tests/worker-e-gloss-validation.test.js
          tests/sharded-dictionary-provider.test.js
      - name: Publish hypothesis 1 atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Halo Learning B07 Workbench"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/b07-apply-hypothesis1.yml scripts/b07-hypothesis1.patch
          git add \
            packages/lexical-index/browser-lexical-shards.js \
            apps/extension/src/shared/runtime-shard-browser.js \
            tests/browser-lexical-shards.test.js \
            tests/worker-e-runtime-performance.test.js
          git diff --cached --check
          git commit -m "perf: move shard invariants to build attestation for B07"
          git push origin HEAD:integration/v0.4.0-final-convergence
