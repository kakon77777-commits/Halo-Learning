name: v0.5.0 Dogfood Inline Execution

on:
  push:
    branches:
      - workbench/v0.5.0-local-dogfood
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v050-dogfood-inline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dogfood-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused v0.5 dogfood Node tests
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'tests/dogfood-*.test.js' > /dev/null; then
            node --test tests/dogfood-*.test.js
          fi
      - id: detect-browser
        name: Detect v0.5 browser tests
        shell: bash
        run: |
          if compgen -G 'tests/browser/v050-*.e2e.test.js' > /dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.detect-browser.outputs.run == 'true'
        name: Install Chromium
        run: npx playwright install --with-deps chromium
      - if: steps.detect-browser.outputs.run == 'true'
        name: Focused v0.5 Chromium gates
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a timeout --kill-after=10s 600s node --test tests/browser/v050-*.e2e.test.js

  node:
    needs: dogfood-focused
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full Node regression
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee full-node-regression.log
      - if: failure()
        name: Upload full Node failure log
        uses: actions/upload-artifact@v4
        with:
          name: halo-v0.5.0-full-node-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: full-node-regression.log
          if-no-files-found: error
          retention-days: 7
      - name: Source hygiene
        run: git diff --check

  dogfood-package:
    needs: node
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - id: detect
        name: Detect dogfood packager
        shell: bash
        run: |
          if test -f scripts/package-v0.5.0-dogfood.js; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.detect.outputs.run == 'true'
        name: Build v0.5 DOGFOOD package
        run: node scripts/package-v0.5.0-dogfood.js
      - if: steps.detect.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: halo-v0.5.0-dogfood-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/halo-learning-magic-hand-v0.5.0-dogfood.zip
            docs/dogfood/v0.5.0-local-install.md
            docs/dogfood/v0.5.0-dogfood-validation.md
          if-no-files-found: error
          retention-days: 30
