name: v0.4.0 Final Closure Lexical Identity Fix

on:
  push:
    branches:
      - integration/v0.4.0-final-convergence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lexical-identity-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded lexical identity patch
        run: python3 scripts/final-closure-apply-lexical-identity-fix.py
      - name: Full Node regression
        run: npm test
      - name: Static closure checks
        run: |
          node --check apps/extension/src/service-worker.js
          node --check apps/extension/src/content.js
          node --check tests/final-closure-lexical-identity.test.js
          git diff --check
      - name: Publish only from unchanged canonical parent
        run: |
          if git diff --quiet; then
            echo 'Lexical identity production boundary is already aligned.'
            exit 0
          fi
          remote_head="$(git ls-remote origin refs/heads/integration/v0.4.0-final-convergence | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Canonical branch moved during verification: $GITHUB_SHA -> $remote_head"
            echo 'Refusing to publish stale production patch.'
            exit 2
          fi
          git config user.name 'Halo v0.4 Closure'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/extension/src/service-worker.js apps/extension/src/content.js
          git commit -m 'fix: align lexical runtime identity across enrichment [lexical-identity-green]'
          git push origin HEAD:integration/v0.4.0-final-convergence
