name: B02 one-shot canonical patch

on:
  push:
    branches:
      - integration/v0.4.0-final-convergence

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v0.4.0-final-convergence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply exact B02 patch and self-remove runner
        run: node scripts/b02-apply-once.js
      - name: Focused B02 regression
        run: node --test tests/reversible-renderer.test.js tests/dynamic-dom-controller.test.js
      - name: Commit canonical B02 patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: align renderer mutation journal with Chromium normalization'
          git push origin HEAD:integration/v0.4.0-final-convergence
