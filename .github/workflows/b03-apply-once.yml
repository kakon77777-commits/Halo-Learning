name: B03 apply once

on:
  push:
    branches:
      - integration/v0.4.0-final-convergence

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply bounded B03 test-harness repair
        run: node scripts/b03-apply-once.js
      - name: Verify command and policy contracts
        run: node --test tests/browser-trigger-entry.test.js tests/site-policy.test.js tests/content-policy-lifecycle.test.js
      - name: Verify B03 in real Chromium
        run: timeout --kill-after=10s 180s node --test tests/browser/sensitive-site.e2e.test.js
      - name: Commit only after green verification
        run: |
          set -euo pipefail
          rm scripts/b03-apply-once.js .github/workflows/b03-apply-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/sensitive-site.e2e.test.js scripts/b03-apply-once.js .github/workflows/b03-apply-once.yml
          git commit -m 'test: use deterministic registered command dispatch for B03'
          git push origin HEAD:integration/v0.4.0-final-convergence
