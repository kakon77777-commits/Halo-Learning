name: Worker E Current vs Base Regression Diagnostic

on:
  push:
    branches:
      - parallel/v0.4.0-runtime-performance

permissions:
  contents: read

jobs:
  compare-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Run current full suite without masking output
        id: current
        shell: bash
        run: |
          set +e
          npm test > current-test.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "CURRENT_EXIT=$code"
          echo '=== CURRENT FAILING LINES ==='
          grep -nE '(^not ok|# fail|AssertionError|ERR_|Error:|FAIL|failed|failure)' current-test.log | tail -n 160 || true
          echo '=== CURRENT TAIL ==='
          tail -n 180 current-test.log
          exit 0
      - name: Prepare exact base worktree
        run: |
          git worktree add /tmp/halo-worker-e-base b6cd8ccfd705563bad7dcea87900d50fa8ca0b80
          cd /tmp/halo-worker-e-base
          npm ci
      - name: Run exact base full suite
        id: base
        shell: bash
        run: |
          set +e
          cd /tmp/halo-worker-e-base
          npm test > "$GITHUB_WORKSPACE/base-test.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "BASE_EXIT=$code"
          echo '=== BASE FAILING LINES ==='
          grep -nE '(^not ok|# fail|AssertionError|ERR_|Error:|FAIL|failed|failure)' "$GITHUB_WORKSPACE/base-test.log" | tail -n 160 || true
          echo '=== BASE TAIL ==='
          tail -n 180 "$GITHUB_WORKSPACE/base-test.log"
          exit 0
      - name: Compare outcomes
        run: |
          echo "current=${{ steps.current.outputs.exit_code }} base=${{ steps.base.outputs.exit_code }}"
          if [ "${{ steps.current.outputs.exit_code }}" != "${{ steps.base.outputs.exit_code }}" ]; then
            echo 'OUTCOME_DIFFERENCE=true'
          else
            echo 'OUTCOME_DIFFERENCE=false'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-e-current-vs-base-regression-logs
          path: |
            current-test.log
            base-test.log
          if-no-files-found: error
          retention-days: 14
