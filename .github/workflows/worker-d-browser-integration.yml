name: Worker D Frozen Source Snapshot

on:
  push:
    branches:
      - parallel/v0.4.0-browser-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact frozen Worker B base
        uses: actions/checkout@v4
        with:
          ref: b6cd8ccfd705563bad7dcea87900d50fa8ca0b80

      - name: Verify frozen source SHA
        run: test "$(git rev-parse HEAD)" = "b6cd8ccfd705563bad7dcea87900d50fa8ca0b80"

      - name: Upload D-owned source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: worker-d-frozen-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/browser/dynamic-dom.e2e.test.js
            scripts/collect-worker-b-browser-evidence.js
            tests/browser/helpers/service-worker-cdp.js
          if-no-files-found: error
          retention-days: 14
