name: Worker D Repair Harness

on:
  push:
    branches:
      - parallel/v0.4.0-browser-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/v0.4.0-browser-integration
          fetch-depth: 0

      - name: Apply repair
        run: python .github/worker-d-repair-round-1.py

      - name: Validate repair
        run: |
          node --check tests/browser/dynamic-dom.e2e.test.js
          node --check scripts/collect-worker-b-browser-evidence.js
          git diff --check
          git rm .github/worker-d-repair-round-1.py
          git status --short

      - name: Commit repair
        run: |
          git config user.name "EveMissLab Worker D"
          git config user.email "worker-d@users.noreply.github.com"
          git add tests/browser/dynamic-dom.e2e.test.js scripts/collect-worker-b-browser-evidence.js
          git commit -m "fix: close Worker D browser lifecycle blockers"
          git push origin HEAD:parallel/v0.4.0-browser-integration
