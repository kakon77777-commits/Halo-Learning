name: Worker D Dynamic DOM Diagnostic

on:
  push:
    branches:
      - parallel/v0.4.0-browser-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-dom-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact frozen Worker B base
        uses: actions/checkout@v4
        with:
          ref: b6cd8ccfd705563bad7dcea87900d50fa8ca0b80

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Install real Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve Chromium and prepare diagnostics
        run: |
          set -euo pipefail
          mkdir -p evidence/worker-d-dynamic-diagnostic
          node - <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          const executable = chromium.executablePath();
          if (!fs.existsSync(executable)) throw new Error(`Chromium missing at ${executable}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `HALO_CHROMIUM_EXECUTABLE=${executable}\n`);
          console.log(`HALO_CHROMIUM_EXECUTABLE=${executable}`);
          NODE

      - name: Instrument dynamic-DOM async boundaries without changing product code
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const target = 'tests/browser/dynamic-dom.e2e.test.js';
          let source = fs.readFileSync(target, 'utf8');
          const pageAnchor = '      const page = await context.newPage();';
          if (!source.includes(pageAnchor)) throw new Error('dynamic-DOM page anchor missing');
          source = source.replace(
            '    context = await launchExtension({',
            "    console.error('[D-DIAG] launchExtension:start');\n    context = await launchExtension({"
          );
          source = source.replace(
            '    await withFixtureServer({',
            "    console.error('[D-DIAG] launchExtension:end');\n    console.error('[D-DIAG] withFixtureServer:start');\n    await withFixtureServer({"
          );
          source = source.replace(pageAnchor, `${pageAnchor}
      console.error('[D-DIAG] page:new:end');
      let __haloDiagSeq = 0;
      for (const __haloDiagMethod of ['goto', 'evaluate', 'addScriptTag', 'waitForSelector', 'waitForFunction', 'waitForTimeout']) {
        const __haloDiagOriginal = page[__haloDiagMethod].bind(page);
        page[__haloDiagMethod] = async (...args) => {
          const id = ++__haloDiagSeq;
          const head = args[0];
          const detail = typeof head === 'string'
            ? head
            : typeof head === 'function'
              ? String(head).replace(/\\s+/g, ' ').slice(0, 120)
              : head && typeof head === 'object' && head.path
                ? head.path
                : typeof head;
          console.error('[D-DIAG] ' + id + ' ' + __haloDiagMethod + ':start ' + detail);
          try {
            const value = await __haloDiagOriginal(...args);
            console.error('[D-DIAG] ' + id + ' ' + __haloDiagMethod + ':end');
            return value;
          } catch (error) {
            console.error('[D-DIAG] ' + id + ' ' + __haloDiagMethod + ':error ' + (error && error.message));
            throw error;
          }
        };
      }`);
          source = source.replace(
            "    });\n  } finally {\n    if (context) await context.close();",
            "    });\n    console.error('[D-DIAG] withFixtureServer:end');\n  } finally {\n    console.error('[D-DIAG] contextClose:start');\n    if (context) await context.close();\n    console.error('[D-DIAG] contextClose:end');"
          );
          fs.writeFileSync(target, source);
          NODE

      - name: Run focused diagnostic
        id: diagnostic
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 185s node --test tests/browser/dynamic-dom.e2e.test.js 2>&1 | tee evidence/worker-d-dynamic-diagnostic/dynamic-dom-diagnostic.log

      - name: Upload focused diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-d-dynamic-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/worker-d-dynamic-diagnostic/
          if-no-files-found: error
          retention-days: 14

      - name: Record diagnostic outcome
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
        run: echo "diagnostic_outcome=$DIAGNOSTIC_OUTCOME"
