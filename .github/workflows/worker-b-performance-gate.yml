name: Worker B Performance and MV3 Gate

on:
  push:
    branches:
      - parallel/v0.4.0-browser-ux
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-chromium-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/v0.4.0-browser-ux
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Align Worker B diagnostic sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          collector = Path('scripts/collect-worker-b-browser-evidence.js')
          s = collector.read_text(encoding='utf-8')
          selection_pattern = re.compile(
              r"  if \(!comparison\.selection \|\| comparison\.selection\.status !== 'selected'\) \{\n"
              r"\s*throw new Error\('browser shard comparison selected no v0\.4 candidate'\);\n"
              r"\s*\}\n"
              r"\s*const selectedBucketCount = comparison\.selection\.selectedBucketCount;\n"
              r"\s*const artifacts = buildBrowserRuntimeArtifacts\(\{\n"
              r"\s*\.\.\.CORPORA,\n"
              r"\s*builtAt: '2026-08-25T00:00:00\.000Z',\n"
              r"\s*bucketCount: selectedBucketCount,\n"
              r"\s*selectionStatus: 'selected-by-browser-comparison'\n"
              r"\s*\}\);"
          )
          replacement = """  const selectionPassed = Boolean(comparison.selection && comparison.selection.status === 'selected');
          const selectedBucketCount = selectionPassed ? comparison.selection.selectedBucketCount : null;
          const diagnosticBucketCount = selectedBucketCount || 128;
          const artifacts = buildBrowserRuntimeArtifacts({
            ...CORPORA,
            builtAt: '2026-08-25T00:00:00.000Z',
            bucketCount: diagnosticBucketCount,
            selectionStatus: selectionPassed ? 'selected-by-browser-comparison' : 'worker-b-diagnostic-only'
          });"""
          s, changed = selection_pattern.subn(replacement, s, count=1)
          if changed == 0 and 'const diagnosticBucketCount = selectedBucketCount || 128;' not in s:
              raise SystemExit('collector shard-selection pattern not recognized')
          collector.write_text(s, encoding='utf-8', newline='\n')

          dynamic_test = Path('tests/browser/dynamic-dom.e2e.test.js')
          d = dynamic_test.read_text(encoding='utf-8')
          old_dependency = "  'shared/runtime-scheduler.js',\n  'shared/dynamic-dom-controller.js',"
          new_dependency = "  'shared/runtime-scheduler.js',\n  'shared/trigger-controller.js',\n  'shared/dynamic-dom-controller.js',"
          if old_dependency in d:
              d = d.replace(old_dependency, new_dependency, 1)
          elif new_dependency not in d:
              raise SystemExit('dynamic DOM script dependency pattern not recognized')
          dynamic_test.write_text(d, encoding='utf-8', newline='\n')
          PY

          node --check scripts/collect-worker-b-browser-evidence.js
          node --check tests/browser/dynamic-dom.e2e.test.js
          git diff --check
          if ! git diff --quiet -- scripts/collect-worker-b-browser-evidence.js tests/browser/dynamic-dom.e2e.test.js; then
            git config user.name 'Halo Worker B'
            git config user.email 'worker-b@users.noreply.github.com'
            git add scripts/collect-worker-b-browser-evidence.js tests/browser/dynamic-dom.e2e.test.js
            git commit -m 'test: complete Worker B blocked-path diagnostics'
            git push origin HEAD:parallel/v0.4.0-browser-ux
          fi

      - name: Browser performance acceptance model
        run: node --test tests/browser-performance-metrics.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Focused dynamic DOM browser regression
        id: dynamic
        continue-on-error: true
        run: timeout 180s node --test tests/browser/dynamic-dom.e2e.test.js

      - name: Prepare evidence directories
        run: |
          rm -rf evidence/worker-b-final evidence/shard-diagnostic
          mkdir -p evidence/worker-b-final evidence/shard-diagnostic

      - name: Run fixed 64/128 real Chromium diagnostic
        id: shard
        continue-on-error: true
        run: |
          set -o pipefail
          node - <<'NODE' 2>&1 | tee evidence/shard-diagnostic/summary.txt
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          const { runShardComparison, verifyBrowserShardComparison } = require('./scripts/profile-browser-runtime');
          (async () => {
            const comparison = await runShardComparison({ executablePath: chromium.executablePath() });
            verifyBrowserShardComparison(comparison);
            fs.writeFileSync('evidence/shard-diagnostic/v0.4.0-browser-shard-comparison.json', JSON.stringify(comparison, null, 2) + '\n');
            console.log(JSON.stringify({
              browser: comparison.browser,
              host: comparison.host,
              selection: comparison.selection,
              candidates: comparison.candidates.map((candidate) => ({
                bucketCount: candidate.bucketCount,
                measurements: candidate.measurements,
                budgets: candidate.budgets,
                gates: candidate.gates,
                allBlockingPassed: candidate.allBlockingPassed,
                coldRawMs: candidate.conditions.cold.samples.map((sample) => sample.durationMs),
                warmSampleCount: candidate.conditions.warm.samples.reduce((n, sample) => n + sample.samplesMs.length, 0),
                longTasksMs: candidate.conditions.longTasks.samples.flatMap((sample) => sample.durationsMs)
              }))
            }, null, 2));
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Enforce frozen shard selection
        id: selection
        continue-on-error: true
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const comparison = JSON.parse(fs.readFileSync('evidence/shard-diagnostic/v0.4.0-browser-shard-comparison.json', 'utf8'));
          if (!comparison.selection || comparison.selection.status !== 'selected') {
            throw new Error(`frozen browser shard selection blocked: ${JSON.stringify(comparison.selection)}`);
          }
          console.log(`selected=${comparison.selection.selectedBucketCount}`);
          NODE

      - name: Collect real Chromium performance and MV3 evidence
        id: collector
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 1500s node scripts/collect-worker-b-browser-evidence.js evidence/worker-b-final 2>&1 | tee evidence/worker-b-final.log

      - name: Verify generated performance and lifecycle evidence
        id: verify
        continue-on-error: true
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { evaluateBrowserPerformance, evaluateMv3Lifecycle } = require('./packages/quality/browser-performance');
          const performance = JSON.parse(fs.readFileSync('evidence/worker-b-final/v0.4.0-worker-b-browser-performance.json', 'utf8'));
          const mv3 = JSON.parse(fs.readFileSync('evidence/worker-b-final/v0.4.0-worker-b-mv3-lifecycle.json', 'utf8'));
          const perf = evaluateBrowserPerformance(performance);
          const lifecycle = evaluateMv3Lifecycle(mv3);
          if (!perf.allBlockingPassed) throw new Error('performance evidence does not pass frozen gates');
          if (!lifecycle.allBlockingPassed) throw new Error('MV3 evidence does not pass frozen gates');
          if (!mv3.details || mv3.details.routeNavigation !== true) throw new Error('route-navigation evidence is missing');
          console.log(JSON.stringify({ performance: perf.measurements, performanceGates: perf.gates, mv3Gates: lifecycle.gates }, null, 2));
          NODE

      - name: Upload Worker B performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-b-performance-mv3-evidence
          path: |
            evidence/worker-b-final/
            evidence/worker-b-final.log
            evidence/shard-diagnostic/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Worker B performance gate
        if: always()
        env:
          DYNAMIC: ${{ steps.dynamic.outcome }}
          SHARD: ${{ steps.shard.outcome }}
          SELECTION: ${{ steps.selection.outcome }}
          COLLECTOR: ${{ steps.collector.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          printf 'dynamic=%s\nshard=%s\nselection=%s\ncollector=%s\nverify=%s\n' "$DYNAMIC" "$SHARD" "$SELECTION" "$COLLECTOR" "$VERIFY"
          test "$DYNAMIC" = success
          test "$SHARD" = success
          test "$SELECTION" = success
          test "$COLLECTOR" = success
          test "$VERIFY" = success
