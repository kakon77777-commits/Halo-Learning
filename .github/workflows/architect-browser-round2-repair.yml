name: Architect Browser Round 2 Repair

on:
  push:
    branches:
      - integration/v0.4.0-final-convergence
    paths:
      - .github/workflows/architect-browser-round2-repair.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v0.4.0-final-convergence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the proven Chrome 151 fixture repair only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/browser/sentence-pipeline.e2e.test.js')
          text = path.read_text(encoding='utf-8')
          old = """        Object.defineProperty(globalThis, 'chrome', {
                    configurable: true,
                    value: {
                      runtime: {
          """
          new = """        const chromeNamespace = globalThis.chrome && typeof globalThis.chrome === 'object'
                    ? globalThis.chrome
                    : {};
                  if (globalThis.chrome !== chromeNamespace) {
                    Object.defineProperty(globalThis, 'chrome', { configurable: true, value: chromeNamespace });
                  }
                  Object.defineProperty(chromeNamespace, 'runtime', {
                    configurable: true,
                    writable: true,
                    value: {
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy chrome fixture block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          node --check tests/browser/sentence-pipeline.e2e.test.js
          git diff --check
      - name: Retire one-shot Architect repair workflows
        run: |
          git rm .github/workflows/architect-browser-round2-repair.yml
          if [ -f .github/workflows/architect-mv3-observation-repair.yml ]; then
            git rm .github/workflows/architect-mv3-observation-repair.yml
          fi
      - name: Commit bounded round-2 fixture repair
        run: |
          git config user.name "Halo Architect"
          git config user.email "actions@users.noreply.github.com"
          git add tests/browser/sentence-pipeline.e2e.test.js
          git commit -m "test: align sentence fixture with native Chrome namespace"
          git push origin HEAD:integration/v0.4.0-final-convergence
