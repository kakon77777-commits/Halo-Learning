name: Worker E Runtime Performance Gate

on:
  push:
    branches:
      - parallel/v0.4.0-runtime-performance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Apply prior verified Worker E implementation
        run: |
          python scripts/worker-e-apply-green.py
          python scripts/worker-e-fix-decomposition-driver.py
          python scripts/worker-e-apply-decomposition.py
          python scripts/worker-e-apply-linear-validation.py
          python scripts/worker-e-apply-delivered-bytes.py
          node --check apps/extension/src/shared/runtime-shard-browser.js
          node --check scripts/profile-browser-runtime.js
          git diff --check

      - name: Worker E RED/GREEN contract
        run: node --test tests/worker-e-runtime-performance.test.js tests/worker-e-descriptor-bytes.test.js tests/worker-e-gloss-validation.test.js

      - name: Lexical shard regression tests
        run: node --test tests/browser-lexical-shards.test.js tests/browser-shard-loader.test.js

      - name: Install Chromium
        if: success()
        run: npx playwright install --with-deps chromium

      - name: Collect fresh real-Chromium 64/128 comparison
        if: success()
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const { runShardComparison, verifyBrowserShardComparison } = require('./scripts/profile-browser-runtime');
          (async () => {
            const comparison = await runShardComparison({ executablePath: chromium.executablePath() });
            verifyBrowserShardComparison(comparison);
            console.log(JSON.stringify({ selection: comparison.selection, candidates: comparison.candidates.map((candidate) => ({ bucketCount: candidate.bucketCount, measurements: candidate.measurements, bottleneckDecomposition: candidate.bottleneckDecomposition, gates: candidate.gates })) }, null, 2));
          })().catch((error) => { console.error(error.stack || error.message); process.exitCode = 1; });
          NODE
