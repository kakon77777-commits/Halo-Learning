<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Halo Learning - Magic Hand</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header>
      <div class="eyebrow">HALO LEARNING · SEMANTIC</div>
      <h1>Magic Hand <span>魔法之手</span></h1>
      <p>English / 中文 semantic marking</p>
    </header>

    <section class="group">
      <label class="row switch-row">
        <span><strong>POS labels</strong><small>詞性小標</small></span>
        <input id="posLabels" type="checkbox">
      </label>
      <label class="row switch-row">
        <span><strong>POS colors</strong><small>詞性顏色</small></span>
        <input id="posColors" type="checkbox">
      </label>
    </section>

    <details class="group advanced">
      <summary>Semantic channels · 語意頻道</summary>
      <label class="row switch-row">
        <span><strong>Lemma</strong><small>詞元</small></span>
        <input id="lemma" type="checkbox">
      </label>
      <label class="row switch-row">
        <span><strong>Morphology</strong><small>形態</small></span>
        <input id="morphology" type="checkbox">
      </label>
      <label class="row switch-row">
        <span><strong>Gloss hint</strong><small>釋義提示</small></span>
        <input id="glossHint" type="checkbox">
      </label>
      <label class="row switch-row">
        <span><strong>Grammar role</strong><small>文法角色</small></span>
        <input id="grammarRole" type="checkbox">
      </label>
      <label class="row switch-row">
        <span><strong>Tense / aspect</strong><small>時態／體</small></span>
        <input id="tenseAspect" type="checkbox">
      </label>
      <label class="row switch-row">
        <span><strong>Chunk / structure</strong><small>片語／結構</small></span>
        <input id="chunk" type="checkbox">
      </label>
      <label class="row switch-row unavailable" title="Available in a later release">
        <span><strong>Learning state</strong><small>學習狀態（尚未提供）</small></span>
        <input id="learningState" type="checkbox" disabled>
      </label>
    </details>

    <section class="group">
      <label for="density" class="stack">
        <span class="label-line"><strong>Density</strong><small>標記密度 <output id="densityValue">65%</output></small></span>
        <input id="density" type="range" min="0" max="100" step="5">
      </label>

      <label for="languageMode" class="stack">
        <span class="label-line"><strong>Language</strong><small>語言</small></span>
        <select id="languageMode">
          <option value="both">English + 中文</option>
          <option value="en">English only</option>
          <option value="zh-Hant">中文 only</option>
        </select>
      </label>

      <label for="labelPosition" class="stack">
        <span class="label-line"><strong>POS position</strong><small>詞性位置</small></span>
        <select id="labelPosition">
          <option value="top-right">Top right · 右上</option>
          <option value="top-left">Top left · 左上</option>
          <option value="bottom-right">Bottom right · 右下</option>
          <option value="inline">Inline · 行內</option>
        </select>
      </label>

      <label for="triggerMode" class="stack">
        <span class="label-line"><strong>Interaction</strong><small>觸發方式</small></span>
        <select id="triggerMode">
          <option value="hybrid">Hybrid · 混合</option>
          <option value="adaptive-hover">Adaptive hover · 自適應懸停</option>
          <option value="explicit-only">Explicit only · 僅明確操作</option>
        </select>
      </label>
    </section>

    <section class="actions">
      <button id="analyzeSelectionButton" class="primary analyze" type="button">Analyze selection · 解析選取</button>
      <button id="applyButton" class="primary" type="button">Apply · 套用</button>
      <button id="removeButton" class="secondary" type="button">Remove · 移除</button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">Ready · 就緒</p>
    <p class="privacy">Local only · No page upload · 本機處理</p>
  </main>

  <script src="shared/settings.js"></script>
  <script src="shared/profile-controls.js"></script>
  <script src="shared/profile-persistence.js"></script>
  <script src="shared/browser-entry.js"></script>
  <script src="shared/popup-actions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
